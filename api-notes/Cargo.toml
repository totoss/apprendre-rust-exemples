[package]
name = "api-notes"
version = "0.1.0"
edition = "2024"

# Module 16 : API REST avec Axum et SQLx.
# Nécessite l'éditeur de liens et un compilateur C (SQLite est compilé depuis ses sources).
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.7", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
